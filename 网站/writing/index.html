  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* ========== 作者个人空间 · 与主站统一视觉 ========== */
    :root {
      --w-ink: #1a1a1a;          /* 墨色 */
      --w-ink-soft: #888888;     /* 说明小字 */
      --w-accent: #9e2b25;       /* 朱砂红 */
      --w-accent-dark: #7d1f1a;
      --w-line: #e9e5df;         /* 极淡中性分隔 */
      --w-card: #ffffff;         /* 卡片白底 */
    }

    body {
      background: #faf8f5;
      color: var(--w-ink);
    }

    .site-header {
      background: transparent;
      border-bottom: none;
    }

    .brand { color: var(--w-ink); }
    .brand-icon { background: var(--w-card); }
    .tagline { color: var(--w-ink-soft); }
    .tagline-link { color: var(--w-ink-soft); }
    .tagline-link:hover { color: var(--w-accent); }
    .site-footer { border-top: none; }

    /* 作者区 */
    .author-hero {
      text-align: center;
      margin: 56px 0 36px;
    }
    .author-hero h1 {
      font-size: 34px;
      letter-spacing: 5px;
      margin: 0 0 12px;
    }
    .author-hero p {
      color: var(--w-ink-soft);
      font-size: 15px;
      margin: 0 0 10px;
    }
    .author-sign {
      font-family: var(--font-serif);
      color: var(--w-ink-soft);
      font-size: 18px;
    }

    /* 作品列表 */
    .works h2 {
      font-size: 20px;
      letter-spacing: 2px;
      margin: 0 0 18px;
    }
    .work-card {
      background: var(--w-card);
      border-radius: 12px;
      padding: 22px 24px;
    }
    .work-card h3 {
      margin: 0 0 8px;
      font-size: 19px;
      letter-spacing: 1px;
    }
    .work-badge {
      display: inline-block;
      background: #f0ece6;
      color: #888888;
      font-size: 12px;
      padding: 2px 12px;
      border-radius: 12px;
      margin-left: 8px;
      vertical-align: middle;
      letter-spacing: 1px;
    }
    .work-card p {
      color: var(--w-ink-soft);
      font-size: 14px;
      margin: 8px 0 0;
      line-height: 1.9;
    }
    .coming-soon {
      color: var(--w-ink-soft);
      font-size: 13px;
      margin-top: 24px;
      text-align: center;
    }

    /* 手记 */
    .notes { margin-top: 8px; text-align: left; }
    .section-title {
      font-size: 20px;
      letter-spacing: 2px;
      margin: 0 0 18px;
    }
    .note {
      background: var(--w-card);
      border-radius: 12px;
      padding: 26px 28px;
    }
    .note-title {
      font-size: 22px;
      letter-spacing: 1px;
      margin: 0 0 16px;
    }
    .note h4 {
      font-size: 16px;
      color: var(--w-ink);
      margin: 22px 0 8px;
    }
    .note p {
      color: var(--w-ink-soft);
      font-size: 15px;
      line-height: 2;
      margin: 0 0 12px;
      text-align: justify;
    }
    .note ul {
      color: var(--w-ink-soft);
      font-size: 15px;
      line-height: 1.9;
      padding-left: 1.5em;
      margin: 0 0 12px;
    }
    .note li { margin-bottom: 4px; }
    .note .note-bold { margin-top: 18px; }

    /* 栏目 */
    .columns { margin-top: 8px; }
    .column {
      background: var(--w-card);
      border: 1px solid var(--w-line);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 18px;
      box-shadow: 0 2px 10px rgba(90, 60, 20, 0.06);
    }
    .column h2 {
      font-size: 19px;
      letter-spacing: 2px;
      margin: 0 0 12px;
    }
    .column ul { list-style: none; margin: 0; padding: 0; }
    .column li { padding: 8px 0; }
    .column li:last-child { border-bottom: none; }
    .column a {
      color: var(--w-ink);
      text-decoration: none;
      font-size: 15px;
      line-height: 1.7;
    }
    .column a:hover { color: var(--w-accent); }
    .column .col-tag {
      display: inline-block; background: #f0ece6; color: #888888;
      font-size: 11px; padding: 1px 8px; border-radius: 10px; margin-left: 6px; vertical-align: middle;
    }
    .column .col-empty { color: var(--w-ink-soft); font-size: 13px; }
    .column .col-desc { color: var(--w-ink-soft); font-size: 13px; margin-top: 4px; }

    .footer-note { color: var(--w-ink-soft); }
  </style>
</head>
