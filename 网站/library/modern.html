<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>近現代文學 · 書庫 · 古籍文庫</title>
  <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico">
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    .cat-wrap { max-width: 900px; }
    .cat-back { display: inline-block; margin-top: 24px; color: var(--accent); text-decoration: none; font-size: 14px; }
    .cat-back:hover { text-decoration: underline; }
    .cat-head {
      display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
      border-bottom: 2px solid var(--gold); padding-bottom: 10px; margin: 14px 0 22px;
    }
    .cat-head h1 { font-size: 30px; letter-spacing: 6px; margin: 0; }
    .cat-head .cat-desc { color: var(--ink-soft); font-size: 13px; }
    .cat-empty { color: var(--ink-soft); padding: 48px 0; text-align: center; border: 1px dashed var(--line); border-radius: 8px; }
  </style>
</head>
<body data-cat="modern">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="../index.html"><img class="brand-icon" src="../assets/images/brand-icon.png" alt="古籍文庫"> 古籍文庫</a>
      <div class="header-actions">
<div class="search-box">
        <button id="search-toggle" type="button" title="搜索：書名 / 作者 / 分類" aria-label="搜索">🔍</button>
        <input id="search-input" type="text" placeholder="搜書名 / 作者 / 分類" autocomplete="off" aria-label="搜索">
        <div id="search-dropdown" hidden></div>
      </div>

        <span class="tagline">書庫 · 近現代文學</span>
        <a class="tagline-link" href="../library.html" title="書庫 · 經史子集">書庫</a>
        <a class="tagline-link" href="../ai-settings.html" title="AI 設置 · 配置 API Key">AI 設置</a>
        <a class="tagline-link" href="../ai-guide.html" title="AI 新手指南">AI 指南</a>
        <a class="tagline-link" href="../index.html" title="返回首頁">首頁</a>
      </div>
    </div>
  </header>

  <main class="container cat-wrap">
    <a class="cat-back" href="../library.html">← 返回書庫</a>
    <div class="cat-head">
      <h1 id="cat-title">近現代文學</h1>
      <span class="cat-desc" id="cat-desc"></span>
    </div>
    <div class="lib-books" id="cat-books"></div>
    <div class="cat-empty" id="cat-empty" hidden>該部暫無收錄書籍</div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-note">文本來源：Project Gutenberg 古登堡計劃 · 內容僅供學習研究使用</div>
      <div class="footer-donate"><a href="../sponsor.html">贊助</a></div>
    </div>
  </footer>
  <script src="../../js/cat.js"></script>
  <script src="../../js/global-ai.js"></script>
<!-- 全站搜索移动端浮层 -->
  <div id="search-overlay" role="dialog" aria-label="搜索">
    <div class="ov-head">
      <input id="search-input-m" type="text" placeholder="搜書名 / 作者 / 分類" autocomplete="off">
      <button id="search-close-m" type="button">關閉</button>
    </div>
    <div id="search-results-m"></div>
  </div>
  <script src="../js/home-search.js"></script>
</body>
</html>
