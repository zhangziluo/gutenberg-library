<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>古籍文库 · 在线阅读</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html"><span class="brand-seal">書</span> 古籍文库</a>
      <span class="tagline">古登堡计划 · 繁体中文古籍在线阅读</span>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">书架</h1>
    <p class="page-sub">请选择一部典籍开始阅读</p>
    <div id="book-shelf" class="book-shelf"></div>
    <div class="ai-entry"><a class="btn btn-ai" href="/reader/shiji_reader.html" target="_blank">🤖 打开 AI 古文阅读器</a></div>
    <div class="writing-entry"><a class="btn btn-writing" href="writing/">✍️ 作者手记</a></div>
    <div id="loading" class="notice">正在加载书目…</div>
    <div id="error" class="notice error" hidden></div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <!-- ============ 支持作者 ============ -->
      <div class="support">
        <p class="support-title">如果这些内容对你有帮助，请作者喝杯茶 ☕</p>
        <div class="support-qr">
          <!-- 爱发电：截图放到 网站/images/ 后，把占位块替换为 <img class="qr-img" src="images/afdian-qr.png" alt="爱发电">（也可换成你的爱发电主页链接） -->
          <div class="qr-slot qr-ph" title="爱发电（待上传）">
            <span class="qr-label">爱发电</span>
            <span class="qr-hint">待添加</span>
          </div>
          <!-- 微信收款码：把占位块替换为 <img class="qr-img" src="images/wechat-qr.png" alt="微信收款码"> -->
          <div class="qr-slot qr-ph" title="微信收款码（待上传）">
            <span class="qr-label">微信收款码</span>
            <span class="qr-hint">待添加</span>
          </div>
          <!-- 支付宝收款码：把占位块替换为 <img class="qr-img" src="images/alipay-qr.png" alt="支付宝收款码"> -->
          <div class="qr-slot qr-ph" title="支付宝收款码（待上传）">
            <span class="qr-label">支付宝收款码</span>
            <span class="qr-hint">待添加</span>
          </div>
        </div>
      </div>
      <!-- ============ /支持作者 ============ -->
      <div class="footer-note">文本来源：Project Gutenberg 古登堡计划 · 内容仅供学习研究使用</div>
    </div>
  </footer>

  <script src="js/common.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
