<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>古籍文庫 · 古登堡繁體古籍線上閱讀</title>
  <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ===== 極簡首頁：仿古宣紙 / 墨色 / 朱砂點綴 / 響應式 ===== */
    :root {
      --h-ink: #3a3226;        /* 墨色（正文） */
      --h-soft: #6b6152;       /* 次墨（說明/來源） */
      --h-line: #d9c8b0;       /* 舊紙淺棕線 */
      --h-bg: #f5f0e6;         /* 宣紙底 */
      --h-card: #ece1ce;       /* 卡片/容器（比主底深一層） */
      --h-card-deep: #e8dcc4;  /* 頂欄更深一層 */
      --h-accent: #9e2b25;     /* 朱砂點綴 */
    }
    body { background: var(--h-bg); color: var(--h-ink); }
    .site-header {
      background: var(--h-card-deep);
      border-bottom: 1px solid var(--h-line);
      box-shadow: none;
    }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      padding-top: 12px;
      padding-bottom: 12px;
    }
    .brand { font-size: 21px; letter-spacing: 3px; color: var(--h-ink); white-space: nowrap; }
    .main-nav { display: flex; gap: 30px; }
    .main-nav a {
      color: var(--h-soft); text-decoration: none; font-size: 15px; letter-spacing: 2px;
      transition: color .15s ease;
    }
    .main-nav a:hover, .main-nav a.active { color: var(--h-ink); }
    /* 每日一句 */
    .daily { max-width: 760px; margin: 110px auto 30px; text-align: center; }
    .daily-quote { font-size: 1.5rem; line-height: 2.1; letter-spacing: 1px; }
    .daily-quote::before, .daily-quote::after { color: var(--h-soft); }
    .daily-source { color: var(--h-soft); font-size: 13px; margin-top: 20px; }
    .daily-read {
      display: inline-block; margin-top: 30px; padding: 11px 38px;
      border: 1px solid var(--h-accent); border-radius: 30px;
      color: var(--h-accent); text-decoration: none; font-size: 15px; letter-spacing: 2px;
      transition: background .15s ease, color .15s ease;
    }
    .daily-read:hover { background: var(--h-accent); color: #fff; }
    .daily-shuffle {
      display: block; margin: 18px auto 0; background: none; border: none;
      color: #a2947e; font-size: 12px; cursor: pointer; font-family: inherit; letter-spacing: 1px;
    }
    .daily-shuffle:hover { color: var(--h-ink); }
    .daily-empty, .daily-loading { color: var(--h-soft); font-size: 14px; }

    /* 五部分类入口 */
    .cat-entries {
      display: flex; justify-content: center; gap: 16px; flex-wrap: wrap;
      margin: 70px 0 110px;
    }
    .cat-entry {
      display: block; min-width: 128px; padding: 26px 18px; text-align: center;
      border: 1px solid var(--h-line); border-radius: 12px; background: var(--h-card);
      color: var(--h-ink); text-decoration: none; font-size: 18px; letter-spacing: 4px;
      transition: border-color .15s ease, transform .15s ease;
    }
    .cat-entry:hover { border-color: var(--h-accent); transform: translateY(-2px); }
    .cat-entry small { display: block; color: var(--h-soft); font-size: 11px; letter-spacing: 1px; margin-top: 8px; }

    /* 页脚 */
    .site-footer {
      border-top: 1px solid var(--h-line); background: transparent;
      color: #a2947e; font-size: 12px;
    }
    .site-footer .footer-note { color: #a2947e; }
    .footer-links { margin-top: 8px; }
    .footer-links a { color: #a2947e; text-decoration: none; margin: 0 10px; }
    .footer-links a:hover { color: var(--h-accent); }

    /* 右下角小麒麟（純裝飾，不攔截點擊） */
    .qilin {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 9999;
      width: 48px;
      height: 48px;
      padding: 4px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0.92;
    }
    .qilin svg { width: 100%; height: 100%; display: block; }

    @media (max-width: 640px) {
      .main-nav { gap: 18px; order: 3; width: 100%; justify-content: center; }
      .search-box { order: 2; }
      .daily { margin-top: 70px; }
      .daily-quote { font-size: 1.25rem; }
      .cat-entries { flex-direction: column; align-items: center; }
      .cat-entry { width: 76%; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html"><img class="brand-icon" src="assets/images/brand-icon.png" alt="古籍文庫"> 古籍文庫</a>
      <nav class="main-nav">
        <a href="index.html" class="active">首頁</a>
        <a href="library.html">書庫</a>
        <a href="writing/">作者手記</a>
      </nav>
      <div class="search-box">
        <button id="search-toggle" type="button" title="搜索：書名 / 作者 / 分類" aria-label="搜索">🔍</button>
        <input id="search-input" type="text" placeholder="搜書名 / 作者 / 分類" autocomplete="off" aria-label="搜索">
        <div id="search-dropdown" hidden></div>
      </div>
    </div>
    <!-- 移動端搜索浮層 -->
    <div id="search-overlay" role="dialog" aria-label="搜索">
      <div class="ov-head">
        <input id="search-input-m" type="text" placeholder="搜書名 / 作者 / 分類" autocomplete="off">
        <button id="search-close-m" type="button">關閉</button>
      </div>
      <div id="search-results-m"></div>
    </div>
  </header>

  <main class="container">
    <!-- 每日一句：句子池按日期種子抽取 -->
    <section class="daily" id="daily">
      <p class="daily-loading" id="daily-loading">今日一句 · 載入中…</p>
      <p class="daily-quote" id="daily-quote" hidden></p>
      <p class="daily-source" id="daily-source" hidden></p>
      <a class="daily-read" id="daily-read" href="#" hidden>開始閱讀 →</a>
      <button class="daily-shuffle" id="daily-shuffle" type="button" hidden>換一句</button>
      <p class="daily-empty" id="daily-empty" hidden>今日暫無推薦</p>
    </section>

    <!-- 五部分類入口 -->
    <section class="cat-entries" aria-label="五部分類">
      <a class="cat-entry" href="/category/jing">經部<small>易書詩禮春秋</small></a>
      <a class="cat-entry" href="/category/shi">史部<small>正史·雜史</small></a>
      <a class="cat-entry" href="/category/zi">子部<small>諸子·小說家</small></a>
      <a class="cat-entry" href="/category/ji">集部<small>詩文·現代文學</small></a>
      <a class="cat-entry" href="/category/cong">叢部<small>叢書·類書</small></a>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-note">本站內容來自古登堡中文古籍計劃，依據 Project Gutenberg License 自由分發 · 內容僅供學習研究使用</div>
      <div class="footer-links">
        <a href="sponsor.html">捐助</a>
        <a href="links.html">相關鏈接</a>
      </div>
    </div>
  </footer>

  <!-- 右下角小麒麟（黑白極簡線條 · 裝飾） -->
  <div class="qilin" aria-hidden="true">
    <svg viewBox="0 0 48 48" fill="none" stroke="#2c241b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <title>麒麟</title>
      <!-- 独角 -->
      <path d="M24.5 10.5 C 26 8, 27.8 6.2, 29.8 5.2"/>
      <path d="M27.2 7.8 C 28.6 6.8, 29.6 6.6, 30.6 6.8"/>
      <!-- 头 -->
      <path d="M29.5 12 C 25 9.8, 20 10.5, 16.5 13.5 C 13.5 16, 12.5 18.5, 12.5 20.5"/>
      <path d="M12.5 20.5 C 13.5 23, 16.5 24.5, 20 24.8 C 24.5 25.2, 28.5 23.8, 30 21.5"/>
      <circle cx="18.5" cy="16.5" r="1" fill="#2c241b" stroke="none"/>
      <circle cx="13.2" cy="19.6" r="0.7" fill="#2c241b" stroke="none"/>
      <!-- 颈 -->
      <path d="M18.5 24.8 C 17.5 28, 18 31, 20 33.5"/>
      <path d="M29.8 12 C 30 16, 30 20, 29.5 24"/>
      <!-- 身 -->
      <path d="M29.5 24 C 34 24.5, 38 23, 40.5 20.5"/>
      <path d="M40.5 20.5 C 41.5 24, 40 27, 37 29 C 33 31.5, 27 32, 22 31.5"/>
      <!-- 尾焰 -->
      <path d="M40.5 20.5 C 42.5 18, 43.5 15.5, 43 13"/>
      <path d="M41.5 20 C 43 18, 44 16, 43.8 14.2"/>
      <!-- 腿 -->
      <path d="M21.5 33 L 21.5 41"/>
      <path d="M19 33.5 L 19 41.2"/>
      <path d="M32.5 29.5 L 33.5 41"/>
      <path d="M35.5 28.5 L 37 41"/>
      <!-- 蹄 -->
      <path d="M17.5 41.2 H 20.5"/>
      <path d="M32 41 H 34.5"/>
      <path d="M35.5 41 H 38.5"/>
    </svg>
  </div>

  <script src="js/common.js"></script>
  <script src="js/daily-sentence.js"></script>
  <script src="js/home-search.js"></script>
  <script src="js/global-ai.js"></script>
</body>
</html>
