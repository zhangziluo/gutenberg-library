<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一堆古书 | 没什么正经的，就是一堆古书</title>
  <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ===== 極簡首頁：仿古宣紙 / 墨色 / 朱砂點綴 / 響應式 ===== */
    :root {
      --h-ink: #3a3226;        /* 墨色（正文） */
      --h-soft: #6b6152;       /* 次墨（說明/來源） */
      --h-line: #d9c8b0;       /* 舊紙淺棕線 */
      --h-bg: #f5f0e6;         /* 宣紙底 */
      --h-card: #ece1ce;       /* 卡片/容器（比主底深一層） */
      --h-card-deep: #e8dcc4;  /* 頂欄更深一層 */
      --h-accent: #9e2b25;     /* 朱砂點綴 */
    }
    body { background: var(--h-bg); color: var(--h-ink); }
    .site-header {
      background: var(--h-card-deep);
      border-bottom: 1px solid var(--h-line);
      box-shadow: none;
    }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      padding-top: 12px;
      padding-bottom: 12px;
    }
    .brand { font-size: 21px; letter-spacing: 3px; color: var(--h-ink); white-space: nowrap; }
    /* 首页 Logo 区：主标题 + 副标题（副标题为待定稿占位） */
    .brand-wrap { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .brand-wrap .tagline { font-size: 13px; letter-spacing: 1px; }
    .main-nav { display: flex; gap: 30px; }
    .main-nav a {
      color: var(--h-soft); text-decoration: none; font-size: 15px; letter-spacing: 2px;
      transition: color .15s ease;
    }
    .main-nav a:hover, .main-nav a.active { color: var(--h-ink); }
    /* 每日一句 */
    .daily { max-width: 760px; margin: 110px auto 30px; text-align: center; }
    .daily-quote { font-size: 1.5rem; line-height: 2.1; letter-spacing: 1px; }
    .daily-quote::before, .daily-quote::after { color: var(--h-soft); }
    .daily-source { color: var(--h-soft); font-size: 13px; margin-top: 20px; }
    .daily-read {
      display: inline-block; margin-top: 30px; padding: 11px 38px;
      border: 1px solid var(--h-accent); border-radius: 30px;
      color: var(--h-accent); text-decoration: none; font-size: 15px; letter-spacing: 2px;
      transition: background .15s ease, color .15s ease;
    }
    .daily-read:hover { background: var(--h-accent); color: #fff; }
    .daily-shuffle {
      display: block; margin: 18px auto 0; background: none; border: none;
      color: #a2947e; font-size: 12px; cursor: pointer; font-family: inherit; letter-spacing: 1px;
    }
    .daily-shuffle:hover { color: var(--h-ink); }
    .daily-empty, .daily-loading { color: var(--h-soft); font-size: 14px; }

    /* 五部分类入口 */
    .cat-entries {
      display: flex; justify-content: center; gap: 16px; flex-wrap: wrap;
      margin: 70px 0 110px;
    }
    .cat-entry {
      display: block; min-width: 128px; padding: 26px 18px; text-align: center;
      border: 1px solid var(--h-line); border-radius: 12px; background: var(--h-card);
      color: var(--h-ink); text-decoration: none; font-size: 18px; letter-spacing: 4px;
      transition: border-color .15s ease, transform .15s ease;
    }
    .cat-entry:hover { border-color: var(--h-accent); transform: translateY(-2px); }
    .cat-entry small { display: block; color: var(--h-soft); font-size: 11px; letter-spacing: 1px; margin-top: 8px; }

    /* 页脚 */
    .site-footer {
      border-top: 1px solid var(--h-line); background: transparent;
      color: #a2947e; font-size: 12px;
    }
    .site-footer .footer-note { color: #a2947e; }
    .footer-links { margin-top: 8px; }
    .footer-links a { color: #a2947e; text-decoration: none; margin: 0 10px; }
    .footer-links a:hover { color: var(--h-accent); }

    /* 右下角小麒麟（純裝飾，不攔截點擊） */
    .qilin {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 9999;
      width: 48px;
      height: 48px;
      padding: 4px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0.92;
    }
    .qilin svg { width: 100%; height: 100%; display: block; }

    /* ☯ 今日一卦：右下角胶囊按钮 + 向上弹出浮层（位于装饰麒麟上方，不遮挡其他按钮） */
    #gua-root {
      position: fixed;
      right: 16px;
      bottom: 76px;          /* 麒麟 bottom:16px + 高 48px + 间距 12px */
      z-index: 1000;
    }
    #gua-btn {
      display: block;
      padding: 6px 14px;
      border: 1px solid var(--h-accent);   /* 朱砂红 */
      background: var(--h-bg);              /* 仿古黄 */
      color: var(--h-ink);                  /* 深棕墨 */
      font-size: 14px;
      font-family: inherit;
      letter-spacing: 1px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(60, 50, 30, 0.16);
      transition: background .15s ease, transform .15s ease;
    }
    #gua-btn:hover { background: #efe4cf; transform: translateY(-1px); }
    #gua-pop {
      position: absolute;
      right: 0;
      bottom: 100%;
      margin-bottom: 12px;
      width: 340px;
      max-width: calc(100vw - 32px);
      background: var(--h-bg);              /* 仿古黄 */
      border: 1px solid var(--h-accent);    /* 朱砂红 */
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(60, 50, 30, 0.25);
      padding: 16px 18px;
      text-align: left;
      animation: gua-fade .2s ease;          /* 淡入 200ms */
    }
    #gua-pop[hidden] { display: none; }
    @keyframes gua-fade { from { opacity: 0; } to { opacity: 1; } }
    .gua-type { font-size: 15px; color: var(--h-ink); font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; }
    .gua-glyph { font-size: 22px; vertical-align: -2px; margin-left: 4px; }
    .gua-body { font-size: 14px; line-height: 1.9; color: var(--h-ink); }
    .gua-src { font-size: 12px; color: var(--h-soft); text-align: right; margin-top: 10px; }
    .gua-actions {
      display: flex; gap: 10px; justify-content: flex-end;
      margin-top: 12px; padding-top: 10px;
      border-top: 1px dashed var(--h-line);
    }
    .gua-actions button {
      padding: 4px 14px;
      border: 1px solid var(--h-accent);
      background: transparent;
      color: var(--h-accent);
      font-size: 12px;
      font-family: inherit;
      border-radius: 999px;
      cursor: pointer;
      transition: background .15s ease, color .15s ease;
    }
    .gua-actions button:hover { background: var(--h-accent); color: #fff; }
    /* 「摇一卦」为主要动作：实底朱砂红 */
    .gua-actions #gua-shake { background: var(--h-accent); color: #fff; border-color: var(--h-accent); }
    .gua-actions #gua-shake:hover { background: #7d1f1a; }

    /* 🪙 摇一卦：全屏半透明遮罩 + 铜钱 3D 翻飞 + 六爻 + 卦象结果 */
    #shake-overlay {
      position: fixed; inset: 0;
      z-index: 30000;
      background: rgba(58, 50, 38, 0.6);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      animation: gua-fade .2s ease;
    }
    #shake-overlay[hidden] { display: none; }
    #shake-stage {
      width: 340px; max-width: 100%;
      background: var(--h-bg);
      border: 1px solid var(--h-accent);
      border-radius: 10px;
      padding: 22px 20px 18px;
      text-align: center;
      box-shadow: 0 16px 46px rgba(0, 0, 0, 0.35);
    }
    .coin-wrap { perspective: 600px; display: inline-block; margin: 2px 0 10px; }
    .coin-flip { position: relative; width: 48px; height: 48px; transform-style: preserve-3d; }
    .coin-face {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      border-radius: 50%;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
    }
    .coin-front { transform: rotateY(0deg); }
    .coin-back { transform: rotateY(180deg); }
    .coin-face svg { width: 100%; height: 100%; display: block; }
    .shake-lines { display: flex; flex-direction: column; gap: 2px; min-height: 8px; margin-bottom: 8px; }
    .yao-line { display: flex; justify-content: center; gap: 6px; margin: 3px 0; }
    .yao-line span { display: block; background: #c0392b; border-radius: 2px; }
    .yao-line.yang span { width: 88px; height: 6px; }   /* 阳：红色粗线 — */
    .yao-line.yin span { width: 38px; height: 2px; }    /* 阴：两条红色细线 - - */
    .shake-result[hidden] { display: none; }
    .shake-gua { font-size: 16px; color: var(--h-ink); font-weight: 700; letter-spacing: 1px; }
    .shake-unicode { font-size: 28px; vertical-align: -3px; margin-right: 6px; }
    .shake-tuan { font-size: 14px; line-height: 1.9; color: var(--h-ink); margin-top: 8px; }
    .shake-src { font-size: 12px; color: var(--h-soft); text-align: right; margin-top: 8px; }
    .shake-actions {
      display: flex; gap: 10px; justify-content: center;
      margin-top: 14px; padding-top: 12px;
      border-top: 1px dashed var(--h-line);
    }
    .shake-actions[hidden] { display: none; }
    .shake-actions button {
      padding: 6px 16px; font-size: 13px; font-family: inherit;
      border: 1px solid var(--h-accent); border-radius: 999px;
      background: transparent; color: var(--h-accent); cursor: pointer;
      transition: background .15s ease, color .15s ease;
    }
    .shake-actions button:hover { background: var(--h-accent); color: #fff; }
    .shake-actions #shake-again { background: var(--h-accent); color: #fff; }
    .shake-actions #shake-again:hover { background: #7d1f1a; }

    @media (max-width: 640px) {
      .main-nav { gap: 18px; order: 3; width: 100%; justify-content: center; }
      .search-box { order: 2; }
      .daily { margin-top: 70px; }
      .daily-quote { font-size: 1.25rem; }
      .cat-entries { flex-direction: column; align-items: center; }
      .cat-entry { width: 76%; }
    }
  </style>
</head>
<body>
  <header class="site-header">

    <!-- 移動端搜索浮層 -->
    <div id="search-overlay" role="dialog" aria-label="搜索">

  <main class="container">
    <!-- 每日一句：句子池按日期種子抽取 -->
    <section class="daily" id="daily">
      <p class="daily-loading" id="daily-loading">今日一句 · 載入中…</p>
      <p class="daily-quote" id="daily-quote" hidden></p>

    </div>
  </footer>

  <!-- 右下角小麒麟（黑白極簡線條 · 裝飾） -->
  <div class="qilin" aria-hidden="true">
    <svg viewBox="0 0 48 48" fill="none" stroke="#2c241b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <title>麒麟</title>
      <!-- 独角 -->
      <path d="M24.5 10.5 C 26 8, 27.8 6.2, 29.8 5.2"/>
      <path d="M27.2 7.8 C 28.6 6.8, 29.6 6.6, 30.6 6.8"/>

      <path d="M29.5 12 C 25 9.8, 20 10.5, 16.5 13.5 C 13.5 16, 12.5 18.5, 12.5 20.5"/>

      <path d="M18.5 24.8 C 17.5 28, 18 31, 20 33.5"/>

      <path d="M29.5 24 C 34 24.5, 38 23, 40.5 20.5"/>

      <!-- 尾焰 -->
      <path d="M40.5 20.5 C 42.5 18, 43.5 15.5, 43 13"/>

      <path d="M21.5 33 L 21.5 41"/>

      <path d="M17.5 41.2 H 20.5"/>
      <path d="M32 41 H 34.5"/>
      <path d="M35.5 41 H 38.5"/>
    </svg>
  </div>

  <!-- ☯ 今日一卦：右下角胶囊按钮 + 向上弹出浮层（数据见 js/daily-gua.js） -->
  <div id="gua-root">
    <button id="gua-btn" type="button" title="今日一卦 · 每日一签">☯ 今日一卦</button>
    <div id="gua-pop" hidden></div>
  </div>

  <!-- 🪙 摇一卦：全屏遮罩 + 铜钱 3D 翻飞 + 六爻结果（逻辑见 js/daily-gua.js） -->
  <div id="shake-overlay" hidden>
    <div id="shake-stage">
      <div class="coin-wrap">
        <div class="coin-flip" id="shake-coin">
          <div class="coin-face coin-front">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <circle cx="24" cy="24" r="21" fill="#C9A87A" stroke="#a8894f" stroke-width="2"/>
              <rect x="17" y="20" width="14" height="14" fill="#C9A87A" stroke="#a8894f" stroke-width="2"/>

        <button type="button" id="shake-again">再看一次</button>
        <button type="button" id="shake-close">关闭</button>
      </div>
    </div>
  </div>
