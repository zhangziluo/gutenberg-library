<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>古籍文庫 · 古登堡繁體古籍線上閱讀</title>
  <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ===== 極簡首頁：留白 / 黑白灰 / 繁體優先 / 響應式 ===== */
    :root {
      --h-ink: #1f1f1f;
      --h-soft: #777;
      --h-line: #e6e6e6;
      --h-bg: #fafafa;
    }
    body { background: var(--h-bg); color: var(--h-ink); }
    .site-header {
      background: #fff;
      border-bottom: 1px solid var(--h-line);
      box-shadow: none;
    }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      padding-top: 12px;
      padding-bottom: 12px;
    }
    .brand { font-size: 21px; letter-spacing: 3px; color: var(--h-ink); white-space: nowrap; }
    .main-nav { display: flex; gap: 30px; }
    .main-nav a {
      color: var(--h-soft); text-decoration: none; font-size: 15px; letter-spacing: 2px;
      transition: color .15s ease;
    }
    .main-nav a:hover, .main-nav a.active { color: var(--h-ink); }
    /* 每日一句 */
    .daily { max-width: 760px; margin: 110px auto 30px; text-align: center; }
    .daily-quote { font-size: 1.5rem; line-height: 2.1; letter-spacing: 1px; }
    .daily-quote::before, .daily-quote::after { color: var(--h-soft); }
    .daily-source { color: var(--h-soft); font-size: 13px; margin-top: 20px; }
    .daily-read {
      display: inline-block; margin-top: 30px; padding: 11px 38px;
      border: 1px solid var(--h-ink); border-radius: 30px;
      color: var(--h-ink); text-decoration: none; font-size: 15px; letter-spacing: 2px;
      transition: background .15s ease, color .15s ease;
    }
    .daily-read:hover { background: var(--h-ink); color: #fff; }
    .daily-shuffle {
      display: block; margin: 18px auto 0; background: none; border: none;
      color: #aaa; font-size: 12px; cursor: pointer; font-family: inherit; letter-spacing: 1px;
    }
    .daily-shuffle:hover { color: var(--h-ink); }
    .daily-empty, .daily-loading { color: var(--h-soft); font-size: 14px; }

    /* 五部分类入口 */
    .cat-entries {
      display: flex; justify-content: center; gap: 16px; flex-wrap: wrap;
      margin: 70px 0 110px;
    }
    .cat-entry {
      display: block; min-width: 128px; padding: 26px 18px; text-align: center;
      border: 1px solid var(--h-line); border-radius: 12px; background: #fff;
      color: var(--h-ink); text-decoration: none; font-size: 18px; letter-spacing: 4px;
      transition: border-color .15s ease, transform .15s ease;
    }
    .cat-entry:hover { border-color: var(--h-ink); transform: translateY(-2px); }
    .cat-entry small { display: block; color: var(--h-soft); font-size: 11px; letter-spacing: 1px; margin-top: 8px; }

    /* 页脚 */
    .site-footer {
      border-top: 1px solid var(--h-line); background: transparent;
      color: #999; font-size: 12px;
    }
    .site-footer .footer-note { color: #999; }
    .footer-links { margin-top: 8px; }
    .footer-links a { color: #999; text-decoration: none; margin: 0 10px; }
    .footer-links a:hover { color: var(--h-ink); }

    @media (max-width: 640px) {
      .main-nav { gap: 18px; order: 3; width: 100%; justify-content: center; }
      .search-box { order: 2; }
      .daily { margin-top: 70px; }
      .daily-quote { font-size: 1.25rem; }
      .cat-entries { flex-direction: column; align-items: center; }
      .cat-entry { width: 76%; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html"><img class="brand-icon" src="assets/images/brand-icon.png" alt="古籍文庫"> 古籍文庫</a>
      <nav class="main-nav">
        <a href="index.html" class="active">首頁</a>
        <a href="library.html">書庫</a>
        <a href="writing/">作者手記</a>
      </nav>
      <div class="search-box">
        <button id="search-toggle" type="button" title="搜索：書名 / 作者 / 分類" aria-label="搜索">🔍</button>
        <input id="search-input" type="text" placeholder="搜書名 / 作者 / 分類" autocomplete="off" aria-label="搜索">
        <div id="search-dropdown" hidden></div>
      </div>
    </div>
    <!-- 移動端搜索浮層 -->
    <div id="search-overlay" role="dialog" aria-label="搜索">
      <div class="ov-head">
        <input id="search-input-m" type="text" placeholder="搜書名 / 作者 / 分類" autocomplete="off">
        <button id="search-close-m" type="button">關閉</button>
      </div>
      <div id="search-results-m"></div>
    </div>
  </header>

  <main class="container">
    <!-- 每日一句：句子池按日期種子抽取 -->
    <section class="daily" id="daily">
      <p class="daily-loading" id="daily-loading">今日一句 · 載入中…</p>
      <p class="daily-quote" id="daily-quote" hidden></p>
      <p class="daily-source" id="daily-source" hidden></p>
      <a class="daily-read" id="daily-read" href="#" hidden>開始閱讀 →</a>
      <button class="daily-shuffle" id="daily-shuffle" type="button" hidden>換一句</button>
      <p class="daily-empty" id="daily-empty" hidden>今日暫無推薦</p>
    </section>

    <!-- 五部分類入口 -->
    <section class="cat-entries" aria-label="五部分類">
      <a class="cat-entry" href="/library/jing">經部<small>易書詩禮春秋</small></a>
      <a class="cat-entry" href="/library/shi">史部<small>正史·雜史</small></a>
      <a class="cat-entry" href="/library/zi">子部<small>諸子·小說家</small></a>
      <a class="cat-entry" href="/library/ji">集部<small>詩文總集</small></a>
      <a class="cat-entry" href="/library/modern">近現代文學<small>現當代作品</small></a>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-note">本站內容來自古登堡中文古籍計劃 · 內容僅供學習研究使用</div>
      <div class="footer-links">
        <a href="sponsor.html">捐助</a>
        <a href="links.html">相關鏈接</a>
      </div>
    </div>
  </footer>

  <script src="js/common.js"></script>
  <script src="js/daily-sentence.js"></script>
  <script src="js/home-search.js"></script>
  <script src="js/global-ai.js"></script>
</body>
</html>
