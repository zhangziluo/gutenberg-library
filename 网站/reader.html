<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阅读 · 一堆古书</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- opencc-js：简繁转换（同步转换，全量字典） -->
  <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html"><img class="brand-icon" src="assets/images/brand-icon.png" alt="一堆古书"> 一堆古书</a>
      <div class="header-actions">
<div class="search-box">
        <button id="search-toggle" type="button" title="搜索：書名 / 作者 / 分類" aria-label="搜索">🔍</button>
        <input id="search-input" type="text" placeholder="搜書名 / 作者 / 分類" autocomplete="off" aria-label="搜索">
        <div id="search-dropdown" hidden></div>
      </div>

        <span class="tagline" id="header-book"></span>
        <a class="tagline-link" href="library.html" title="书库 · 经史子集">书库</a>
        <a class="tagline-link" href="ai-settings.html" title="AI 设置 · 配置 API Key">AI 设置</a>
        <a class="tagline-link" href="ai-guide.html" title="AI 新手指南">AI 指南</a>
        <a class="tagline-link" href="writing/" title="作者手记 · 原创小说">作者手记</a>
      </div>
    </div>
  </header>

  <main class="container reader-wrap">
    <div class="reader-topbar">
      <a class="btn" id="back-btn" href="#">← 返回目录</a>
      <div class="reader-tools">
        <button class="btn" id="download-txt" title="下载本篇正文为 TXT">⬇ TXT</button>
        <button class="btn" id="copy-text" title="一键复制全文">📋 复制全文</button>
        <span class="reader-lang-wrap" data-ann-lang-host data-ann-label="注:"></span>
      </div>
    </div>

    <!-- 阅读设置：字体 / 配色 / 背景与字色自定义（与 AI 阅读器共用 gjs:reading） -->
    <div class="reading-settings">
      <div class="rs-group">
        <span class="rs-label">字体</span>
        <button class="rs-btn" id="fontMinus" title="减小字号">A−</button>
        <span class="rs-val" id="fontSizeVal">17</span>
        <button class="rs-btn" id="fontPlus" title="增大字号">A+</button>
      </div>
      <div class="rs-group">
        <span class="rs-label">配色</span>
        <button class="scheme-btn" data-bg="#ffffff" data-fg="#222222" style="background:#ffffff;color:#222222" title="白底黑字">白</button>
        <button class="scheme-btn" data-bg="#1e1e1e" data-fg="#e8e8e8" style="background:#1e1e1e;color:#e8e8e8" title="黑底白字">黑</button>
        <button class="scheme-btn" data-bg="#c7edcc" data-fg="#222222" style="background:#c7edcc;color:#222222" title="护眼绿底黑字">绿</button>
        <button class="scheme-btn active" data-bg="#f5ead0" data-fg="#3a3226" style="background:#f5ead0;color:#3a3226" title="羊皮纸纹理底黑字（默认）">纸</button>
      </div>
      <div class="rs-group">
        <span class="rs-label">简繁</span>
        <button class="rs-btn textmode-btn active" data-mode="original" title="保持原文（繁体）">原文</button>
        <button class="rs-btn textmode-btn" data-mode="toSimple" title="繁体转简体">繁→简</button>
        <button class="rs-btn textmode-btn" data-mode="toTraditional" title="简体转繁体">简→繁</button>
      </div>
      <div class="rs-group">
        <span class="rs-label">模式</span>
        <button class="rs-btn level-btn active" data-level="beginner" title="新手：大字号 + 全注释（拼音与释义）">新手</button>
        <button class="rs-btn level-btn" data-level="intermediate" title="进阶：中字号 + 多音字注音、重难字释义">进阶</button>
        <button class="rs-btn level-btn" data-level="expert" title="专家：小字号 + 只标重难字">专家</button>
      </div>
      <div class="rs-group">
        <span class="rs-label">背景</span>
        <input type="color" id="bgPicker" class="rs-color" title="取色器">
        <input type="text" id="bgHex" class="rs-hex" placeholder="#f5ead0" title="背景十六进制">
        <input type="text" id="bgRgb" class="rs-rgb" placeholder="245,234,208" title="背景 RGB">
      </div>
      <div class="rs-group">
        <span class="rs-label">字色</span>
        <input type="color" id="fgPicker" class="rs-color" title="取色器">
        <input type="text" id="fgHex" class="rs-hex" placeholder="#3a3226" title="字色十六进制">
        <input type="text" id="fgRgb" class="rs-rgb" placeholder="58,50,38" title="字色 RGB">
      </div>
    </div>

    <article class="reader" id="reader"></article>
    <div class="reader-nav">
      <a class="btn" id="prev-btn" href="#">← 上一篇</a>
      <a class="btn" id="next-btn" href="#">下一篇 →</a>
    </div>
    <div id="loading" class="notice">正在加载正文…</div>
    <div id="error" class="notice error" hidden></div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-note">文本来源：Project Gutenberg，依据 Project Gutenberg License 自由分发 · 内容仅供学习研究使用</div>
      <div class="footer-links"><a href="https://ics-editor.zhang409543901.workers.dev/" target="_blank" rel="noopener">日程编辑与提醒器</a></div>
      <div class="footer-donate"><a href="sponsor.html">赞助</a></div>
    </div>
  </footer>

  <!-- 深度学习悬浮按钮（右下角固定，滚动不消失；内联样式+onclick 保证不受缓存影响） -->
  <button class="btn btn-ai-mode" id="ai-mode-btn" onclick="goAIMode()"
          style="position:fixed;right:24px;bottom:28px;z-index:999;"
          title="在 AI 阅读器中深度学习本篇（保留当前阅读位置）">🤖 深度学习</button>

  <script>
  // 深度学习：跳转 AI 阅读器并保留当前阅读位置
  // 内联定义，不依赖外部 JS 加载状态/缓存；正文与锚点直接从当前 DOM 提取
  function goAIMode() {
    var titleEl = document.querySelector('.reader-title');
    var headerBook = document.getElementById('header-book');
    // 简繁转换只影响显示/复制/下载；送入 AI 的始终是原文（用户可在 AI 对话中自行决定）
    var orig = window.__readerOriginal || null;
    var parasEl = Array.prototype.slice.call(document.querySelectorAll('#reader-body p'));
    var title = (orig && orig.title) ? orig.title : (titleEl ? titleEl.textContent.trim() : '古文篇目');
    var parasArr = (orig && orig.paras && orig.paras.length) ? orig.paras
      : parasEl.map(function (p) { return p.textContent; });
    var text = parasArr.join('\n\n');

    var anchor = '';
    if (parasArr.length) {
      var vh = window.innerHeight || 800;
      var bestIdx = 0, bestDist = Infinity;
      parasEl.forEach(function (p, i) {
        var r = p.getBoundingClientRect();
        if (r.bottom < 0 || r.top > vh) return;
        var dist = Math.abs(r.top + r.height / 2 - vh * 0.4);
        if (dist < bestDist) { bestDist = dist; bestIdx = i; }
      });
      anchor = parasArr[bestIdx] ? parasArr[bestIdx].trim() : '';
    }

    try {
      sessionStorage.setItem('lib_selected', JSON.stringify({
        title: title,
        text: text,
        source: headerBook ? headerBook.textContent.replace(/[《》]/g, '') : '一堆古书',
        pos: anchor || ''
      }));
    } catch (e) { /* 隐私模式等异常忽略 */ }

    // 统一跳转路径：与首页 AI 阅读器入口一致（部署后 AI 阅读器位于 /reader/ 下，
    // 相对路径 public/reader/... 在 Cloudflare 上会 404，必须用绝对路径）
    window.location.href = '/reader/shiji_reader.html';
  }
  </script>

  <script src="js/common.js"></script>
  <script src="js/reader.js"></script>
  <script src="js/annotation-lang.js"></script>
  <script src="js/global-ai.js"></script>
<!-- 全站搜索移动端浮层 -->
  <div id="search-overlay" role="dialog" aria-label="搜索">
    <div class="ov-head">
      <input id="search-input-m" type="text" placeholder="搜書名 / 作者 / 分類" autocomplete="off">
      <button id="search-close-m" type="button">關閉</button>
    </div>
    <div id="search-results-m"></div>
  </div>
  <script src="js/home-search.js"></script>
</body>
</html>
