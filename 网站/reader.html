<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阅读 · 一堆古书</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- opencc-js：简繁转换（同步转换，全量字典） -->
  <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html"><img class="brand-icon" src="assets/images/brand-icon.png" alt="一堆古书"> 一堆古书</a>
      <div class="header-actions">
<div class="search-box">
        <button id="search-toggle" type="button" title="搜索：書名 / 作者 / 分類" aria-label="搜索">🔍</button>
        <input id="search-input" type="text" placeholder="搜書名 / 作者 / 分類" autocomplete="off" aria-label="搜索">
        <div id="search-dropdown" hidden></div>
      </div>

        <span class="tagline" id="header-book"></span>
        <a class="tagline-link" href="library.html" title="书库 · 经史子集">书库</a>
        <a class="tagline-link" href="ai-settings.html" title="AI 设置 · 配置 API Key">AI 设置</a>
        <a class="tagline-link" href="ai-guide.html" title="AI 新手指南">AI 指南</a>
        <a class="tagline-link" href="writing/" title="网站日志">网站日志</a>
      </div>
    </div>
  </header>

  <main class="container reader-wrap">
    <div class="reader-topbar">
      <a class="btn" id="back-btn" href="#">← 返回目录</a>
      <div class="reader-tools">
        <button class="btn" id="download-txt" title="下载本篇正文为 TXT">⬇ TXT</button>
        <button class="btn" id="copy-text" title="一键复制全文">📋 复制全文</button>
        <span class="reader-lang-wrap" data-ann-lang-host data-ann-label="注:"></span>
      </div>
    </div>

    <!-- 阅读设置：字体 / 配色 / 背景与字色自定义（全局 AI 助手主题同步用 gjs:reading） -->
    <div class="reading-settings">
      <div class="rs-group">
        <span class="rs-label">字体</span>
        <button class="rs-btn" id="fontMinus" title="减小字号">A−</button>
        <span class="rs-val" id="fontSizeVal">17</span>
        <button class="rs-btn" id="fontPlus" title="增大字号">A+</button>
      </div>
      <div class="rs-group">
        <span class="rs-label">配色</span>
        <button class="scheme-btn" data-bg="#ffffff" data-fg="#1a1a1a" style="background:#ffffff;color:#1a1a1a" title="白底黑字">白</button>
        <button class="scheme-btn" data-bg="#1a1a1a" data-fg="#f0ece6" style="background:#1a1a1a;color:#f0ece6" title="黑底浅字">黑</button>
        <button class="scheme-btn" data-bg="#c7edcc" data-fg="#1a1a1a" style="background:#c7edcc;color:#1a1a1a" title="护眼绿底黑字">绿</button>
        <button class="scheme-btn active" data-bg="#faf8f5" data-fg="#1a1a1a" style="background:#faf8f5;color:#1a1a1a" title="暖白底黑字（默认）">纸</button>
      </div>
      <div class="rs-group">
        <span class="rs-label">简繁</span>
        <button class="rs-btn textmode-btn active" data-mode="original" title="保持原文（繁体）">原文</button>
        <button class="rs-btn textmode-btn" data-mode="toSimple" title="繁体转简体">繁→简</button>
        <button class="rs-btn textmode-btn" data-mode="toTraditional" title="简体转繁体">简→繁</button>
      </div>
      <div class="rs-group">
        <span class="rs-label">模式</span>
        <button class="rs-btn level-btn active" data-level="beginner" title="新手：大字号 + 全注释（拼音与释义）">新手</button>
        <button class="rs-btn level-btn" data-level="intermediate" title="进阶：中字号 + 多音字注音、重难字释义">进阶</button>
        <button class="rs-btn level-btn" data-level="expert" title="专家：小字号 + 只标重难字">专家</button>
      </div>
      <div class="rs-group">
        <span class="rs-label">背景</span>
        <input type="color" id="bgPicker" class="rs-color" title="取色器">
        <input type="text" id="bgHex" class="rs-hex" placeholder="#faf8f5" title="背景十六进制">
        <input type="text" id="bgRgb" class="rs-rgb" placeholder="250,248,245" title="背景 RGB">
      </div>
      <div class="rs-group">
        <span class="rs-label">字色</span>
        <input type="color" id="fgPicker" class="rs-color" title="取色器">
        <input type="text" id="fgHex" class="rs-hex" placeholder="#1a1a1a" title="字色十六进制">
        <input type="text" id="fgRgb" class="rs-rgb" placeholder="26,26,26" title="字色 RGB">
      </div>
    </div>

    <article class="reader" id="reader"></article>
    <div class="reader-nav">
      <a class="btn" id="prev-btn" href="#">← 上一篇</a>
      <a class="btn" id="next-btn" href="#">下一篇 →</a>
    </div>
    <div id="loading" class="notice">正在加载正文…</div>
    <div id="error" class="notice error" hidden></div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-note">文本来源：Project Gutenberg，依据 Project Gutenberg License 自由分发 · 内容仅供学习研究使用</div>
      <div class="footer-links"><a href="mailto:409543901@qq.com">联系</a><a href="https://mydream-4y4.pages.dev/" target="_blank" rel="noopener">站长的创作站点</a><a href="https://ics-editor.zhang409543901.workers.dev/" target="_blank" rel="noopener">日程编辑与提醒器</a></div>
      <div class="footer-donate"><a href="sponsor.html">赞助</a></div>
    </div>
  </footer>

  <script src="js/common.js"></script>
  <script src="js/reader.js"></script>
  <script src="js/annotation-lang.js"></script>
  <script src="js/global-ai.js"></script>
<!-- 全站搜索移动端浮层 -->
  <div id="search-overlay" role="dialog" aria-label="搜索">
    <div class="ov-head">
      <input id="search-input-m" type="text" placeholder="搜書名 / 作者 / 分類" autocomplete="off">
      <button id="search-close-m" type="button">關閉</button>
    </div>
    <div id="search-results-m"></div>
  </div>
  <script src="js/home-search.js"></script>
</body>
</html>
