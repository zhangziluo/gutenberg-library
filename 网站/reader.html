<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阅读 · 古籍文库</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- opencc-js：简繁转换（同步转换，全量字典） -->
  <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html"><img class="brand-icon" src="assets/images/brand-icon.png" alt="古籍文库"> 古籍文库</a>
      <div class="header-actions">
        <span class="tagline" id="header-book"></span>
        <a class="tagline-link" href="library.html" title="书库 · 经史子集">书库</a>
        <a class="tagline-link" href="ai-settings.html" title="AI 设置 · 配置 API Key">AI 设置</a>
        <a class="tagline-link" href="ai-guide.html" title="AI 新手指南">AI 指南</a>
        <a class="tagline-link" href="writing/" title="作者手记 · 原创小说">作者手记</a>
      </div>
    </div>
  </header>

  <main class="container reader-wrap">
    <div class="reader-topbar">
      <a class="btn" id="back-btn" href="#">← 返回目录</a>
      <div class="reader-tools">
        <button class="btn" id="download-txt" title="下载本篇正文为 TXT">⬇ TXT</button>
        <button class="btn" id="copy-text" title="一键复制全文">📋 复制全文</button>
      </div>
    </div>

    <!-- 阅读设置：字体 / 配色 / 背景与字色自定义（与 AI 阅读器共用 gjs:reading） -->
    <div class="reading-settings">
      <div class="rs-group">
        <span class="rs-label">字体</span>
        <button class="rs-btn" id="fontMinus" title="减小字号">A−</button>
        <span class="rs-val" id="fontSizeVal">17</span>
        <button class="rs-btn" id="fontPlus" title="增大字号">A+</button>
      </div>
      <div class="rs-group">
        <span class="rs-label">配色</span>
        <button class="scheme-btn" data-bg="#ffffff" data-fg="#222222" style="background:#ffffff;color:#222222" title="白底黑字">白</button>
        <button class="scheme-btn" data-bg="#1e1e1e" data-fg="#e8e8e8" style="background:#1e1e1e;color:#e8e8e8" title="黑底白字">黑</button>
        <button class="scheme-btn" data-bg="#c7edcc" data-fg="#222222" style="background:#c7edcc;color:#222222" title="护眼绿底黑字">绿</button>
        <button class="scheme-btn active" data-bg="#f5ead0" data-fg="#3a3226" style="background:#f5ead0;color:#3a3226" title="羊皮纸底黑字">纸</button>
      </div>
      <div class="rs-group">
        <span class="rs-label">简繁</span>
        <button class="rs-btn textmode-btn active" data-mode="original" title="保持原文（繁体）">原文</button>
        <button class="rs-btn textmode-btn" data-mode="toSimple" title="繁体转简体">繁→简</button>
        <button class="rs-btn textmode-btn" data-mode="toTraditional" title="简体转繁体">简→繁</button>
      </div>
      <div class="rs-group">
        <span class="rs-label">背景</span>
        <input type="color" id="bgPicker" class="rs-color" title="取色器">
        <input type="text" id="bgHex" class="rs-hex" placeholder="#f5ead0" title="背景十六进制">
        <input type="text" id="bgRgb" class="rs-rgb" placeholder="245,234,208" title="背景 RGB">
      </div>
      <div class="rs-group">
        <span class="rs-label">字色</span>
        <input type="color" id="fgPicker" class="rs-color" title="取色器">
        <input type="text" id="fgHex" class="rs-hex" placeholder="#3a3226" title="字色十六进制">
        <input type="text" id="fgRgb" class="rs-rgb" placeholder="58,50,38" title="字色 RGB">
      </div>
    </div>

    <article class="reader" id="reader"></article>
    <div class="reader-nav">
      <a class="btn" id="prev-btn" href="#">← 上一篇</a>
      <a class="btn" id="next-btn" href="#">下一篇 →</a>
    </div>
    <div id="loading" class="notice">正在加载正文…</div>
    <div id="error" class="notice error" hidden></div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-note">文本来源：Project Gutenberg 古登堡计划 · 内容仅供学习研究使用</div>
      <div class="footer-donate"><a href="sponsor.html">赞助</a></div>
    </div>
  </footer>

  <!-- 深度学习悬浮按钮（右下角固定，滚动不消失；内联样式+onclick 保证不受缓存影响） -->
  <button class="btn btn-ai-mode" id="ai-mode-btn" onclick="goAIMode()"
          style="position:fixed;right:24px;bottom:28px;z-index:999;"
          title="在 AI 阅读器中深度学习本篇（保留当前阅读位置）">🤖 深度学习</button>

  <script>
  // 深度学习：跳转 AI 阅读器并保留当前阅读位置
  // 内联定义，不依赖外部 JS 加载状态/缓存；正文与锚点直接从当前 DOM 提取
  function goAIMode() {
    var titleEl = document.querySelector('.reader-title');
    var headerBook = document.getElementById('header-book');
    // 简繁转换只影响显示/复制/下载；送入 AI 的始终是原文（用户可在 AI 对话中自行决定）
    var orig = window.__readerOriginal || null;
    var parasEl = Array.prototype.slice.call(document.querySelectorAll('#reader-body p'));
    var title = (orig && orig.title) ? orig.title : (titleEl ? titleEl.textContent.trim() : '古文篇目');
    var parasArr = (orig && orig.paras && orig.paras.length) ? orig.paras
      : parasEl.map(function (p) { return p.textContent; });
    var text = parasArr.join('\n\n');

    var anchor = '';
    if (parasArr.length) {
      var vh = window.innerHeight || 800;
      var bestIdx = 0, bestDist = Infinity;
      parasEl.forEach(function (p, i) {
        var r = p.getBoundingClientRect();
        if (r.bottom < 0 || r.top > vh) return;
        var dist = Math.abs(r.top + r.height / 2 - vh * 0.4);
        if (dist < bestDist) { bestDist = dist; bestIdx = i; }
      });
      anchor = parasArr[bestIdx] ? parasArr[bestIdx].trim() : '';
    }

    try {
      sessionStorage.setItem('lib_selected', JSON.stringify({
        title: title,
        text: text,
        source: headerBook ? headerBook.textContent.replace(/[《》]/g, '') : '古籍文库',
        pos: anchor || ''
      }));
    } catch (e) { /* 隐私模式等异常忽略 */ }

    // 统一跳转路径：与首页 AI 阅读器入口一致（部署后 AI 阅读器位于 /reader/ 下，
    // 相对路径 public/reader/... 在 Cloudflare 上会 404，必须用绝对路径）
    window.location.href = '/reader/shiji_reader.html';
  }
  </script>

  <script>
  // 划词交互：精确高亮选中文字范围（Range API 覆盖 mark）+ 解释/操作浮窗（复制 / AI解读）
  // 关闭：点击浮窗外空白（mousedown）/ Esc / 滚动超 50px / 浮窗右上角 ×；点浮窗内部不关闭
  (function () {
    'use strict';
    var markLayer = null, popup = null, overlay = null;
    var selRange = null, scrollY0 = 0, rafId = 0;

    function isSmall() { return window.innerWidth <= 600; }

    function closeAll() {
      if (markLayer) { markLayer.remove(); markLayer = null; }
      if (popup) { popup.remove(); popup = null; }
      if (overlay) overlay.style.display = 'none';
      selRange = null;
      try { window.getSelection().removeAllRanges(); } catch (e) { /* 忽略 */ }
    }

    function getSelInfo() {
      var sel = window.getSelection();
      if (!sel || sel.isCollapsed) return null;
      var body = document.getElementById('reader-body');
      if (!body || !body.contains(sel.anchorNode) || !body.contains(sel.focusNode)) return null;
      var text = sel.toString().trim();
      if (text.length < 2) return null;   // 1-2 字不自动弹（避免划词误触）
      var range;
      try { range = sel.getRangeAt(0); } catch (e) { return null; }
      var rs = range.getClientRects();
      var rects = [];
      for (var i = 0; i < rs.length; i++) {
        var r = rs[i];
        if (r.width < 1 || r.height < 1) continue;
        rects.push({ left: r.left, top: r.top, width: r.width, height: r.height });
      }
      if (!rects.length) return null;
      return { text: text, range: range, rects: rects };
    }

    // 用绝对定位 <mark> 精确覆盖选中区域（柔和高亮），不影响整行
    function paintMarks(rects) {
      if (!markLayer) {
        markLayer = document.createElement('div');
        markLayer.className = 'sel-layer';
        document.body.appendChild(markLayer);
      } else {
        markLayer.innerHTML = '';
      }
      rects.forEach(function (r) {
        var m = document.createElement('mark');
        m.className = 'sel-mark';
        m.style.left = r.left + 'px';
        m.style.top = r.top + 'px';
        m.style.width = r.width + 'px';
        m.style.height = r.height + 'px';
        markLayer.appendChild(m);
      });
    }

    // 轻微滚动时重贴高亮位置（保持对准文字）
    function refreshMarks() {
      if (!popup || !selRange) return;
      var rs = selRange.getClientRects();
      var rects = [];
      for (var i = 0; i < rs.length; i++) {
        var r = rs[i];
        if (r.width < 1 || r.height < 1) continue;
        rects.push({ left: r.left, top: r.top, width: r.width, height: r.height });
      }
      paintMarks(rects);
    }

    function buildPopup(info) {
      popup = document.createElement('div');
      popup.className = 'sel-popup';

      var head = document.createElement('div');
      head.className = 'sel-popup-head';
      head.innerHTML = '<span class="sel-popup-title">选中文字</span>';
      var close = document.createElement('button');
      close.type = 'button';
      close.className = 'sel-popup-close';
      close.title = '关闭';
      close.innerHTML = '&times;';
      head.appendChild(close);
      popup.appendChild(head);

      var textEl = document.createElement('div');
      textEl.className = 'sel-popup-text';
      textEl.textContent = info.text.length > 120 ? info.text.slice(0, 120) + '…' : info.text;
      popup.appendChild(textEl);

      var actions = document.createElement('div');
      actions.className = 'sel-popup-actions';
      var copyBtn = document.createElement('button');
      copyBtn.type = 'button';
      copyBtn.className = 'sel-popup-btn';
      copyBtn.textContent = '📋 复制';
      copyBtn.addEventListener('click', function () { copyText(info.text, copyBtn); });
      var aiBtn = document.createElement('button');
      aiBtn.type = 'button';
      aiBtn.className = 'sel-popup-btn sel-popup-btn-ai';
      aiBtn.textContent = '🤖 AI 解读';
      aiBtn.addEventListener('click', function () {
        if (window.GAI && window.GAI.openWithText) {
          closeAll();
          window.GAI.openWithText(info.text);   // 打开左侧 AI 窗口并预填
        }
      });
      actions.appendChild(copyBtn);
      actions.appendChild(aiBtn);
      popup.appendChild(actions);

      close.addEventListener('click', closeAll);
      document.body.appendChild(popup);
      positionPopup(info.rects);
    }

    function positionPopup(rects) {
      if (!popup || isSmall()) return;   // 小屏为底部 sheet，由 CSS 定位
      var vw = window.innerWidth;
      var first = rects[0], last = rects[rects.length - 1];
      var cx = first.left + (last.left + last.width - first.left) / 2;
      var top = first.top - popup.offsetHeight - 10;
      if (top < 8) top = last.top + last.height + 10;
      popup.style.left = Math.max(8, Math.min(vw - popup.offsetWidth - 8, cx - popup.offsetWidth / 2)) + 'px';
      popup.style.top = top + 'px';
    }

    function handleSelection() {
      var info = getSelInfo();
      if (!info) { closeAll(); return; }
      closeAll();
      selRange = info.range.cloneRange();
      paintMarks(info.rects);
      buildPopup(info);
      scrollY0 = window.pageYOffset || 0;
      if (isSmall()) {
        if (!overlay) {
          overlay = document.createElement('div');
          overlay.className = 'sel-overlay';
          overlay.addEventListener('mousedown', closeAll);
          document.body.appendChild(overlay);
        }
        overlay.style.display = 'block';
      }
    }

    function copyText(text, btn) {
      function done() {
        var old = btn.textContent;
        btn.textContent = '✅ 已复制';
        setTimeout(function () { btn.textContent = old; }, 1500);
      }
      function fallback() {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch (e) { /* 忽略 */ }
        document.body.removeChild(ta);
        done();
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(fallback);
      } else fallback();
    }

    document.addEventListener('mouseup', function (e) {
      var panel = document.getElementById('gai-panel');
      if (panel && panel.contains(e.target)) return;
      handleSelection();
    });
    // 键盘选中（Shift+方向键）
    document.addEventListener('keyup', function (e) {
      if (e.key === 'Shift' || e.key.indexOf('Arrow') === 0) handleSelection();
    });

    // 关闭：点击浮窗外空白 / Esc / 滚动超 50px
    document.addEventListener('mousedown', function (e) {
      if (popup && !popup.contains(e.target)) closeAll();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeAll();
    });
    window.addEventListener('scroll', function () {
      if (!popup) return;
      if (Math.abs((window.pageYOffset || 0) - scrollY0) > 50) {
        closeAll();
      } else {
        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(refreshMarks);
      }
    }, true);
  })();
  </script>

  <script src="js/common.js"></script>
  <script src="js/reader.js"></script>
  <script src="js/global-ai.js"></script>
</body>
</html>
