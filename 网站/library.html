<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>书库 · 经史子集丛 · 一堆古书</title>
  <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html"><img class="brand-icon" src="assets/images/brand-icon.png" alt="一堆古书"> 一堆古书</a>
      <div class="header-actions">
<div class="search-box">
        <button id="search-toggle" type="button" title="搜索：書名 / 作者 / 分類" aria-label="搜索">🔍</button>
        <input id="search-input" type="text" placeholder="搜書名 / 作者 / 分類" autocomplete="off" aria-label="搜索">
        <div id="search-dropdown" hidden></div>
      </div>

        <span class="tagline">书库 · 经史子集丛</span>
        <a class="tagline-link" href="index.html" title="返回首页">首页</a>
        <a class="tagline-link" href="ai-settings.html" title="AI 设置 · 配置 API Key">AI 设置</a>
        <a class="tagline-link" href="ai-guide.html" title="AI 新手指南">AI 指南</a>
        <a class="tagline-link" href="writing/" title="作者手记 · 原创小说">作者手记</a>
      </div>
    </div>
  </header>

  <main class="container lib-wrap">
    <h1 class="lib-title">📚 书库 · 经史子集丛</h1>
    <p class="lib-sub" id="lib-sub">五部分类 · 正在加载藏书目录…</p>
    <div id="lib-parts"></div>
    <div id="lib-error" class="notice error" hidden></div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-note">文本来源：Project Gutenberg，依据 Project Gutenberg License 自由分发 · 内容仅供学习研究使用</div>
      <div class="footer-donate"><a href="sponsor.html">赞助</a></div>
    </div>
  </footer>

  <script src="js/common.js"></script>
  <script>
  'use strict';
  (async function () {
    const DATA_URL = 'assets/data/books-data.json';
    const partsEl = document.getElementById('lib-parts');
    const subEl = document.getElementById('lib-sub');
    const errEl = document.getElementById('lib-error');

    const PART_NAME = { jing: '經部', shi: '史部', zi: '子部', ji: '集部', cong: '叢部' };
    const ORDER = ['jing', 'shi', 'zi', 'ji', 'cong'];

    function esc(s) { return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c])); }

    function cardHTML(b) {
      const dynTag = b.dynasty ? `<span class="cat-tag cat-dyn">${esc(b.dynasty)}</span>` : '';
      const meta = b.sections ? `共 ${b.sections} 篇` : '';
      return `<a class="lib-book" href="book.html?book=${encodeURIComponent(b.title)}">
          <div class="lib-book-head"><span class="lib-book-name">${esc(b.title)}</span>${dynTag}</div>
          <div class="lib-book-author">${esc(b.author)} 著</div>
          ${b.description ? `<p class="lib-book-intro">${esc(b.description)}</p>` : ''}
          <div class="lib-book-meta">${meta}</div>
          <span class="lib-book-enter">進入閱讀 →</span>
        </a>`;
    }

    try {
      const data = await loadJSON(DATA_URL);
      const descs = data.categories || {};
      const books = data.books || [];
      const totalBy = {};
      let html = '';

      for (const key of ORDER) {
        const list = books.filter(b => b.category === key);
        totalBy[key] = list.length;
        const name = PART_NAME[key];

        if (key === 'ji') {
          const classic = list.filter(b => b.subcategory !== 'modern');
          const modern = list.filter(b => b.subcategory === 'modern');
          html += `<section class="lib-part">
            <div class="lib-part-head">
              <span class="lib-part-name">${esc(name)}</span>
              <span class="lib-part-desc">${esc(descs.ji || '')}</span>
              <span class="lib-part-count">${list.length} 種</span>
              <a class="lib-part-all" href="/category/ji" title="查看全部 · 集部">查看全部 →</a>
            </div>`;
          if (classic.length) {
            html += `<h3 class="lib-sub-block">古典文學</h3><div class="lib-books">${classic.map(cardHTML).join('')}</div>`;
          }
          if (modern.length) {
            html += `<h3 class="lib-sub-block">現代文學</h3><div class="lib-books">${modern.map(cardHTML).join('')}</div>`;
          }
          if (!classic.length && !modern.length) {
            html += `<div class="lib-empty">集部藏書整理中，敬請期待 🌳</div>`;
          }
          html += `</section>`;
          continue;
        }

        html += `<section class="lib-part">
            <div class="lib-part-head">
              <span class="lib-part-name">${esc(name)}</span>
              <span class="lib-part-desc">${esc(descs[key] || '')}</span>
              <span class="lib-part-count">${list.length} 種</span>
              <a class="lib-part-all" href="/category/${key}" title="查看全部 · ${esc(name)}">查看全部 →</a>
            </div>
            ${list.length
              ? `<div class="lib-books">${list.map(cardHTML).join('')}</div>`
              : `<div class="lib-empty">${esc(name)}藏書整理中，敬請期待 🌳</div>`}
          </section>`;
      }

      partsEl.innerHTML = html;
      subEl.textContent = `五部分類 · 共 ${books.length} 種典籍（經 ${totalBy.jing} · 史 ${totalBy.shi} · 子 ${totalBy.zi} · 集 ${totalBy.ji} · 叢 ${totalBy.cong}）`;
    } catch (e) {
      errEl.hidden = false;
      errEl.textContent = '无法加载藏书目录：' + e.message +
        '。请通过本地 HTTP 服务器访问（python3 -m http.server）。';
    }
  })();
  </script>
  <script src="js/global-ai.js"></script>
<!-- 全站搜索移动端浮层 -->
  <div id="search-overlay" role="dialog" aria-label="搜索">
    <div class="ov-head">
      <input id="search-input-m" type="text" placeholder="搜書名 / 作者 / 分類" autocomplete="off">
      <button id="search-close-m" type="button">關閉</button>
    </div>
    <div id="search-results-m"></div>
  </div>
  <script src="js/home-search.js"></script>
</body>
</html>
